name: Temporary focused validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.3
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Report dependency status
        run: flutter pub outdated
        continue-on-error: true
      - name: Format changed sources
        run: dart format lib test
      - name: Upload canonical formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-compatibility-source
          path: lib/screens/powers_screen.dart
          if-no-files-found: error
      - name: Analyze
        run: flutter analyze
      - name: Run targeted tests
        run: flutter test test/app_controller_test.dart test/ui_smoke_test.dart
      - name: Build web
        run: flutter build web --release --no-tree-shake-icons
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: stealth-breaker-web
          path: build/web
          if-no-files-found: error

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: stealth-breaker-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
