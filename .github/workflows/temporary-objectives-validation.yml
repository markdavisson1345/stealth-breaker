name: Temporary objectives validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.3
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format focused changes
        run: dart format lib test
      - name: Upload canonical formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-objectives-source
          path: |
            lib
            test
          if-no-files-found: error
      - run: flutter analyze
      - name: Run targeted tests
        run: >-
          flutter test
          test/star_rating_test.dart
          test/objective_test.dart
          test/app_controller_test.dart
          test/player_progress_test.dart
          test/level_generator_test.dart
          test/ui_smoke_test.dart
      - run: flutter build web --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: stealth-breaker-objectives-web
          path: build/web
          if-no-files-found: error

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
